<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gradPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#ff2d7a"/>
    </linearGradient>

    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9d4dff"/>
      <stop offset="100%" stop-color="#ff4da6"/>
    </linearGradient>

    <!-- NEW HEART COLOR -->
    <linearGradient id="heartBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#4d7cff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Camera Body -->
  <rect x="18" y="28" rx="22" ry="22"
    width="85" height="65"
    fill="url(#gradPink)"
    filter="url(#glow)"/>

  <!-- Lens Outer -->
  <circle cx="60" cy="60" r="18" fill="#111"/>

  <!-- Lens Inner -->
  <circle cx="60" cy="60" r="10" fill="url(#gradPurple)"/>

  <!-- Flash -->
  <circle cx="84" cy="42" r="5" fill="white"/>

  <!-- HEART UPDATED -->
  <path d="M36 20
           C36 10,50 10,50 22
           C50 10,64 10,64 20
           C64 32,50 42,50 42
           C50 42,36 32,36 20Z"
    fill="url(#heartBlue)"
    filter="url(#glow)"/>

</svg>